---
layout: page
---
{% assign theme = site.data.themes[site.ui_theme] %}
<div class="blogcard card-2 mb-4 mt-4" style="width: 100%;">
  <div class="card-body">
    <h1 class="card-title text-center">{{ page.title }}</h1>
    {{ content }}
    <p><strong>Email:</strong> <span>{{ site.email }}</span></p>
    <p><strong>Postal address:</strong> {{ site.address }}</p>
    <p lang="zh-Hant">{{ site.address_zh }}</p>
  </div>
</div>
